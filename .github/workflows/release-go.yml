name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # Full test suite gate (reusable workflow, same as CI) — must pass before any
  # build or release work runs. Plain master pushes no longer run CI, so this
  # tag-time run is the gate for everything that gets published.
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every desktop platform, not just linux: this tarball IS the desktop
        # auto-update payload (the wrapper supervises the server binary as its
        # daemon), so a platform missing here is a platform whose installed
        # launcher can never update itself. All of them cross-compile with
        # CGO_ENABLED=0 from this one ubuntu runner.
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          cd web && pnpm install --frozen-lockfile && cd ..
          make release-server

      # --- Release signing (ACTIVE) ---
      # internal/update/signature.go embeds a real public key
      # (embeddedSigningPubKeyHex), so the auto-updater REQUIRES a detached
      # "<asset>.sig" (raw 64-byte ed25519 signature over the tarball bytes)
      # next to each server tarball it downloads — a release without .sig
      # fails closed on every installed desktop. The step is therefore
      # MANDATORY and fails the build if RELEASE_SIGNING_KEY (ed25519 private
      # key, PEM) is not configured, rather than silently shipping an unsigned
      # release that bricks auto-update. To disable signing, clear
      # embeddedSigningPubKeyHex back to "" in signature.go first.
      - name: Sign release tarballs
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not set, but signature verification is active (embeddedSigningPubKeyHex is non-empty). An unsigned release would brick auto-update. Configure the secret or clear the embedded key." >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-signing.pem"
          for f in dist/citeck_*.tar.gz; do
            openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/release-signing.pem" -in "$f" -out "$f.sig"
          done
          rm -f "$RUNNER_TEMP/release-signing.pem"

      - uses: actions/upload-artifact@v4
        with:
          name: citeck-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  desktop-linux:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install GTK3 / WebKit dev libs
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.0

      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          cd web && pnpm install --frozen-lockfile && cd ..
          make release-desktop-linux

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: dist/citeck-desktop_*
          if-no-files-found: error

  desktop-windows:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install make
        run: choco install make --no-progress

      - name: Install WiX
        run: dotnet tool install --global wix --version 5.*

      - name: Build release artifacts
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          cd web && pnpm install --frozen-lockfile && cd ..
          make release-desktop-windows

      # --- Code signing (disabled — enable when secrets are configured) ---
      # Required secrets: WINDOWS_CERT_PFX (base64 .pfx), WINDOWS_CERT_PASSWORD
      # - name: Sign MSI
      #   env:
      #     WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      #     WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      #   run: |
      #     [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
      #     signtool sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 dist\*.msi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ matrix.arch }}
          path: dist/citeck-desktop_*
          if-no-files-found: error

  desktop-macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # --- Codesign + notarization ---
      # A macOS app that is not Developer ID signed AND notarized is rejected by
      # Gatekeeper after any browser download, with the misleading Finder dialog
      # "citeck-launcher is damaged and can't be opened". Signing therefore runs
      # INSIDE packaging/macos/release.sh (sign-app.sh between make-app.sh and
      # make-dmg.sh, notarize-dmg.sh after) so the ordering cannot drift.
      #
      # Secrets: MACOS_CERT_P12 (base64 .p12), MACOS_CERT_PASSWORD,
      #          MACOS_SIGN_IDENTITY ("Developer ID Application: … (TEAMID)"),
      #          MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_TEAM_ID, MACOS_NOTARY_PASSWORD
      # Set repository variable MACOS_REQUIRE_SIGNED=1 once they are configured,
      # to make an unsigned macOS build fail the release instead of shipping.
      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_REQUIRE_SIGNED: ${{ vars.MACOS_REQUIRE_SIGNED }}
        run: |
          set -euo pipefail
          # Guarded here rather than in `if:` — the secrets context is not
          # dependable in step-level conditions.
          if [ -z "${MACOS_CERT_P12:-}" ]; then
            # Fail here rather than after the full Go + web build: with
            # MACOS_REQUIRE_SIGNED=1 the release is going to fail in
            # sign-app.sh regardless, so surface the misconfiguration before
            # spending ~10 minutes producing an artifact we will reject.
            if [ "${MACOS_REQUIRE_SIGNED:-0}" = "1" ]; then
              echo "::error::MACOS_REQUIRE_SIGNED=1 but MACOS_CERT_P12 is not configured — no Developer ID certificate to import." >&2
              exit 1
            fi
            echo "::warning::MACOS_CERT_P12 is not configured — the macOS build will only be ad-hoc signed and will NOT be notarized."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/codesign.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          umask 077
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on an interactive keychain prompt that
          # no one can answer on a CI runner, and the job hangs until timeout.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Prepend our keychain to the search list without dropping the
          # existing entries. Built as an array rather than an unquoted command
          # substitution so a path containing spaces cannot word-split. (Runner
          # bash is 3.2, so no mapfile; and `${a[@]}` on an empty array trips
          # `set -u`, hence the +expansion guard.)
          existing=()
          while IFS= read -r kc; do
            kc="${kc//\"/}"
            kc="$(printf '%s' "$kc" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            [ -n "$kc" ] && existing+=("$kc")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" ${existing[@]+"${existing[@]}"}
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "MACOS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_REQUIRE_SIGNED: ${{ vars.MACOS_REQUIRE_SIGNED }}
        run: |
          cd web && pnpm install --frozen-lockfile && cd ..
          make release-desktop-macos

      - name: Clean up keychain
        if: ${{ always() && env.MACOS_KEYCHAIN != '' }}
        run: security delete-keychain "$MACOS_KEYCHAIN" || true

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: dist/*.dmg*
          if-no-files-found: error

  release:
    needs: [build, desktop-linux, desktop-windows, desktop-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Extract changelog
        id: changelog
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${VERSION_TAG#v}"
          # Release notes are the English changelog for this version (the in-app
          # auto-updater shows the localized variants from changelog/<ver>/<locale>.md).
          NOTES="changelog/${TAG_VERSION}/en.md"
          if [ -f "$NOTES" ]; then
            body="$(cat "$NOTES")"
          else
            body="Release ${TAG_VERSION}"
          fi
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          # Fail rather than publish a release missing an expected asset — a
          # missing .sig (signature verification is active) would brick
          # auto-update for every installed desktop.
          fail_on_unmatched_files: true
          files: |
            citeck_*.tar.gz
            citeck_*.tar.gz.sha256
            citeck_*.tar.gz.sig
            citeck-desktop_*
            install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
