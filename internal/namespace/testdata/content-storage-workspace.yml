# S3 content storage as a workspace declares it — the reference copy of the
# blocks the public workspace config carries (launcher-public-workspace,
# workspace-v1.yml): the `contentStorage` block, the provider's secrets, its
# additionalApps entry and its sidebar link, each byte for byte. The launcher
# owns the SEAWEEDFS container defaults and migration frame. The bundle names
# its image, settings tune mini, and `contentStorage.s3` connects ecos-content.
# This is a recipe fixture; published workspaces must carry the matching provider declaration.
contentStorage:
  s3:
    app: seaweedfs
    # The product name the content storage option is labelled with:
    # "S3 (SeaweedFS)". Optional; the app id stands in for it.
    title: SeaweedFS
    # The endpoint as ecos-content reaches it: the entry's name and S3 port on
    # the namespace network.
    url: http://seaweedfs:8333
    # The entry's S3_BUCKET — the bucket it creates at start.
    bucket: ecos-content
    # The entry's AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
    accessKey: citeck
    secretKey: ${secret:seaweedfs-s3-key}
secrets:
  # SeaweedFS keys: the S3 secret key (read by the seaweedfs entry and by
  # `contentStorage.s3`) and the key its file tokens are signed with.
  # GENERATED: each namespace draws its own values the first time and keeps
  # them for good, so no stand runs on a key published here. A launcher that
  # supports nested generated options and managed SEAWEEDFS is required. A
  # namespace restored from a snapshot into a new namespace gets new values;
  # on an S3 namespace generation supplies the new key to ecos-content
  # through native ECOS_SECRET_* environment variables. The seaweedfs entry, these
  # secrets, the contentStorage block, the SeaweedFS link and `- seaweedfs` in
  # namespaceTemplates[default].detachedApps travel together.
  - id: seaweedfs-s3-key
    generated:
      length: 40
  - id: seaweedfs-jwt
    generated:
      length: 48
additionalApps:
  # Managed local SeaweedFS. Launcher owns mini, /data, volume generations,
  # stable node identity, standard probes, resource defaults and desktop ports.
  # The bundle supplies the image; absent image means no store is generated.
  # settings overrides only optional mini flags, as scalar YAML values.
  # References below resolve separately for every namespace. Native ECOS env
  # gives ecos-content the same S3 key; JWT keys stay with the provider.
  - name: seaweedfs
    type: SEAWEEDFS
    settings:
      admin.ui: true
      s3.readerCacheSizeMB: 64
      s3.concurrentUploadLimitMB: 128
    environments:
      AWS_ACCESS_KEY_ID: citeck
      AWS_SECRET_ACCESS_KEY: ${secret:seaweedfs-s3-key}
      WEED_JWT_SIGNING_KEY: ${secret:seaweedfs-jwt}
      WEED_JWT_SIGNING_READ_KEY: ${secret:seaweedfs-jwt}
      WEED_JWT_FILER_SIGNING_KEY: ${secret:seaweedfs-jwt}
      WEED_JWT_FILER_SIGNING_READ_KEY: ${secret:seaweedfs-jwt}
      WEED_ADMIN_USER: admin
      WEED_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      S3_BUCKET: ecos-content

links:
  # The SeaweedFS admin UI: the bucket's files, volumes, cluster state. Hidden
  # where the bundle ships no SeaweedFS, greyed out where it is detached (a
  # namespace that keeps its content in the database). It is the entry's
  # admin port, published on loopback on desktop; in server mode the same URL
  # works through an SSH tunnel (docs/content-storage.md in the launcher
  # repository). "Apps" puts it in the sidebar's own Applications group, after
  # RabbitMQ and PgAdmin; a launcher before 2.16 shows the link only for a
  # namespace a newer launcher already ran, under a raw "Apps" header at the
  # bottom of the sidebar.
  - name: SeaweedFS
    url: http://127.0.0.1:23646
    icon: seaweedfs
    category: Apps
    description: "SeaweedFS stores ecos-content files in S3.\nUsername: admin\nPassword: admin"
    dependsOn: [seaweedfs]
# One line of the `default` template's detachedApps — the template itself
# carries more apps and a config.
namespaceTemplates:
  - id: default
    detachedApps:
      - seaweedfs
