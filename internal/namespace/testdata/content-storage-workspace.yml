# S3 content storage as a workspace declares it — the reference copy of the
# blocks the enterprise workspace config carries (workspace-v1.yml). The
# launcher has no code for the provider: whether it exists is the bundle's
# answer (it names the `seaweedfs` image in its `dependencies:` section), the
# entry below is how it is configured, and `contentStorage.s3` is how
# ecos-content reaches it. The entry, the secret and the contentStorage block
# travel together.
contentStorage:
  s3:
    app: seaweedfs
    url: http://seaweedfs:8333
    bucket: ecos-content
    accessKey: citeck
    secretKey: ${secret:seaweedfs-s3}
secrets:
  # NEVER change this value: a namespace restored from a snapshot into a new
  # namespace is seeded with the current default, while its database keeps the
  # key ecos-content was connected with.
  - id: seaweedfs-s3
    value: seaweedfs-s3-secret
additionalApps:
  - name: seaweedfs
    kind: THIRD_PARTY
    cmd:
      - mini
      - -dir=/data
      - -ip=127.0.0.1
      - -master.telemetry=false
      - -master.volumeSizeLimitMB=256
      - -s3.readerCacheSizeMB=64
      - -s3.concurrentUploadLimitMB=128
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environments:
      AWS_ACCESS_KEY_ID: citeck
      AWS_SECRET_ACCESS_KEY: ${secret:seaweedfs-s3}
      S3_BUCKET: ecos-content
      GOMEMLIMIT: 512MiB
    # The volume name IS how the data is found — never change it.
    volumes: ["seaweedfs2:/data"]
    ports: ["8333:8333"]
    startupConditions:
      - probe:
          http: {path: /healthz, port: 8333}
          periodSeconds: 5
          failureThreshold: 60
          timeoutSeconds: 5
    livenessProbe:
      http: {path: /healthz, port: 8333}
      failureThreshold: 7
      timeoutSeconds: 5
    resources:
      limits: {memory: 1g}
    stopTimeout: 15
namespaceTemplates:
  - id: default
    detachedApps:
      - seaweedfs
